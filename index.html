<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій перший сайт</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
      margin: 0;
    }

    .box {
      background: #222;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    h1 {
      color: #00ff88;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #00ff88;
    }

    button:hover {
      background: #00cc6a;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Привіт, це мій сайт</h1>
    <p>Я зробив його сам через GitHub Pages.</p>

    <button onclick="showMessage()">Натисни мене</button>

    <p id="message"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent = "Сайт працює!";
    }
  </script>

</body>
</html>
